<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NachynTube - Premium Streaming</title>
    <style>
        /* CSS RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; }

        /* LOADING ANIMATION (ALA YOUTUBE) */
        #loader-bar {
            position: fixed; top: 0; left: 0; width: 0%; height: 3px;
            background: red; z-index: 9999; transition: width 0.4s ease;
            box-shadow: 0 0 10px red;
        }

        /* NAVBAR */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 25px; background: #0f0f0f; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: bold; color: white; display: flex; align-items: center; }
        .logo span { background: red; color: white; padding: 2px 6px; border-radius: 5px; margin-left: 5px; }

        .search-container { display: flex; width: 40%; }
        .search-container input {
            width: 100%; padding: 10px 15px; border: 1px solid #333;
            background: #121212; color: white; border-radius: 20px 0 0 20px; outline: none;
        }
        .search-container button {
            padding: 0 20px; border: none; background: #333; color: white;
            border-radius: 0 20px 20px 0; cursor: pointer;
        }

        /* MAIN LAYOUT */
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* VIDEO PLAYER SECTION */
        #video-display {
            width: 100%; max-width: 900px; display: none; /* Sembunyi sebelum diputar */
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .player-wrapper {
            position: relative; padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: black; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .player-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* GRID VIDEO HASIL */
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; margin-top: 30px;
        }
        .video-card {
            cursor: pointer; transition: transform 0.3s;
            animation: fadeIn 0.8s ease;
        }
        .video-card:hover { transform: scale(1.05); }
        .video-card img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
        .video-card h3 { font-size: 14px; color: #fff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-card p { font-size: 12px; color: #aaa; margin-top: 5px; }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loader-bar"></div>

    <nav>
        <div class="logo">Nachyn<span>Tube</span></div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Cari video...">
            <button onclick="searchVideo()">Cari</button>
        </div>
        <div style="width: 100px;"></div> </nav>

    <div class="container">
        <div id="video-display">
            <div class="player-wrapper" id="player"></div>
            <h2 id="playing-title" style="margin: 15px 0 30px 0; font-size: 20px;"></h2>
        </div>

        <div class="results-grid" id="results"></div>
    </div>

    <script>
        // GANTI DENGAN API KEY LO DI SINI
        const API_KEY = 'AIzaSyDcY-7czDHgxYjCe6wvjZhusV-4DSBXGkM';

        const loader = document.getElementById('loader-bar');

        function showLoading() {
            loader.style.width = '30%';
            setTimeout(() => { loader.style.width = '70%'; }, 200);
        }

        function hideLoading() {
            loader.style.width = '100%';
            setTimeout(() => { loader.style.width = '0%'; }, 400);
        }

        async function searchVideo() {
            const query = document.getElementById('search-input').value;
            if (!query) return;

            showLoading();

            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${query}&type=video&key=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                data.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <img src="${item.snippet.thumbnails.high.url}" alt="thumb">
                        <h3>${item.snippet.title}</h3>
                        <p>${item.snippet.channelTitle}</p>
                    `;
                    card.onclick = () => playVideo(item.id.videoId, item.snippet.title);
                    resultsDiv.appendChild(card);
                });
            } catch (error) {
                alert("Gagal mengambil data. Cek API Key lo!");
            }

            hideLoading();
        }

        function playVideo(id, title) {
            showLoading();
            
            const display = document.getElementById('video-display');
            const player = document.getElementById('player');
            const titleElem = document.getElementById('playing-title');

            display.style.display = 'block';
            titleElem.innerText = title;

            player.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" 
                    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                </iframe>
            `;

            // Scroll ke atas otomatis pas klik video
            window.scrollTo({ top: 0, behavior: 'smooth' });

            hideLoading();
        }

        // Fitur Enter untuk Search
        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchVideo();
            }
        });
    </script>
</body>
</html>
